<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Crypto Market Report</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .timestamp { color: #888; font-size: 1.1rem; }
        .loading {
            text-align: center;
            padding: 100px;
            font-size: 1.5rem;
            color: #00d4ff;
        }
        .error {
            text-align: center;
            padding: 100px;
            color: #ff4757;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #00d4ff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        th { color: #888; font-weight: 500; font-size: 0.9rem; }
        .positive { color: #00ff88; }
        .negative { color: #ff4757; }
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,212,255,0.3);
        }
        .refresh-btn:hover { transform: scale(1.05); }
        .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .countdown {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Live Crypto Market Report</h1>
            <p class="timestamp" id="lastUpdate">Loading...</p>
        </header>
        <div id="errorBanner" role="alert" hidden></div>
        <div id="content">
            <div class="loading">⏳ Fetching live data from CoinGecko...</div>
        </div>
    </div>
    
    <div class="countdown" id="countdown">Auto-refresh in: 30s</div>
    <button class="refresh-btn" id="refreshBtn" onclick="fetchData()">🔄 Refresh Now</button>

    <script>
        const COINGECKO_API = 'https://api.coingecko.com/api/v3';
        const REFRESH_INTERVAL = 30;
        const MAX_RETRY_DELAY = 300;
        let countdown = REFRESH_INTERVAL;
        let isFetching = false;
        let hasData = false;
        let failureCount = 0;

        class ApiError extends Error {}

        async function fetchJson(url) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 30000);
            try {
                const res = await fetch(url, {signal: controller.signal});
                if (res.status === 429) {
                    throw new ApiError('CoinGecko API rate limit reached (HTTP 429).');
                }
                if (!res.ok) {
                    throw new ApiError(`CoinGecko API returned an error (HTTP ${res.status}).`);
                }
                return await res.json();
            } catch (error) {
                if (error instanceof ApiError) throw error;
                if (error.name === 'AbortError') throw new ApiError('CoinGecko API request timed out.');
                throw new ApiError('Could not reach the CoinGecko API. Check your connection.');
            } finally {
                clearTimeout(timeout);
            }
        }

        async function fetchData() {
            if (isFetching) return;
            isFetching = true;
            updateCountdown();
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            if (!hasData) {
                document.getElementById('content').innerHTML = '<div class="loading">⏳ Fetching live data...</div>';
            }
            
            try {
                // Fetch all data in parallel
                const [globalData, coinsData] = await Promise.all([
                    fetchJson(`${COINGECKO_API}/global`),
                    fetchJson(`${COINGECKO_API}/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false&price_change_percentage=24h`)
                ]);
                if (!globalData?.data || typeof globalData.data !== 'object' || Array.isArray(globalData.data) || !Array.isArray(coinsData)) {
                    throw new ApiError('CoinGecko API returned an unexpected response.');
                }
                
                const scrollY = window.scrollY;
                renderReport(globalData.data, coinsData);
                window.scrollTo(0, scrollY);
                hasData = true;
                document.getElementById('errorBanner').hidden = true;
                failureCount = 0;
                document.getElementById('lastUpdate').textContent = `Last updated: ${new Date().toLocaleString('en-US', {timeZone: 'Asia/Shanghai'})} GMT+8`;
                
                countdown = REFRESH_INTERVAL;
            } catch (error) {
                failureCount++;
                countdown = Math.min(REFRESH_INTERVAL * 2 ** failureCount, MAX_RETRY_DELAY);
                const message = error instanceof ApiError ? error.message : 'Failed to load market data.';
                const banner = document.getElementById('errorBanner');
                banner.textContent = `❌ ${message} Retrying automatically in ${countdown}s, or press Refresh Now.${hasData ? ' Showing last successful update.' : ''}`;
                banner.hidden = false;
                if (!hasData) document.getElementById('content').textContent = '';
            } finally {
                btn.disabled = false;
                isFetching = false;
                updateCountdown();
            }
        }

        function formatNumber(num) {
            num = number(num);
            if (num >= 1e12) return `$${(num/1e12).toFixed(2)}T`;
            if (num >= 1e9) return `$${(num/1e9).toFixed(2)}B`;
            if (num >= 1e6) return `$${(num/1e6).toFixed(2)}M`;
            return `$${num.toLocaleString()}`;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#x27;'}[c]));
        }

        function imageUrl(value) {
            try {
                const url = new URL(value);
                return ['http:', 'https:'].includes(url.protocol) ? escapeHtml(url.href) : '';
            } catch {
                return '';
            }
        }

        function number(value) {
            return typeof value === 'number' && Number.isFinite(value) ? value : 0;
        }

        function coinImage(value) {
            const url = imageUrl(value);
            return url ? `<img src="${url}" style="width:20px;height:20px;vertical-align:middle;margin-right:8px;border-radius:50%">` : '';
        }

        function changeText(value) {
            return `${value > 0 ? '+' : ''}${number(value).toFixed(2)}%`;
        }

        function moverRows(coins) {
            return coins.map((c, i) => `<tr>
                <td>${i+1}</td>
                <td>${escapeHtml(c.symbol.toUpperCase())}</td>
                <td>$${c.current_price?.toLocaleString() ?? 'N/A'}</td>
                <td class="${c.price_change_percentage_24h > 0 ? 'positive' : 'negative'}">${changeText(c.price_change_percentage_24h)}</td>
            </tr>`).join('');
        }

        function renderReport(globalData, coins) {
            coins = coins.filter(c => c && typeof c === 'object' && typeof c.symbol === 'string'
                && ['current_price', 'market_cap', 'total_volume', 'price_change_percentage_24h'].every(key => c[key] == null || (typeof c[key] === 'number' && Number.isFinite(c[key]))));
            const totalMcap = number(globalData.total_market_cap?.usd);
            const mcapChange = number(globalData.market_cap_change_percentage_24h_usd);
            const btcDominance = number(globalData.market_cap_percentage?.btc);
            const volume = number(globalData.total_volume?.usd);
            
            // Sort for gainers/losers
            const gainers = coins.filter(c => number(c.price_change_percentage_24h) > 0).sort((a, b) => b.price_change_percentage_24h - a.price_change_percentage_24h).slice(0, 10);
            const losers = coins.filter(c => number(c.price_change_percentage_24h) < 0).sort((a, b) => a.price_change_percentage_24h - b.price_change_percentage_24h).slice(0, 10);
            
            let html = `
                <div class="grid">
                    <div class="card">
                        <h2>🏛️ Market Overview</h2>
                        <table>
                            <tr><td>Total Market Cap</td><td>${formatNumber(totalMcap)}</td></tr>
                            <tr><td>24h Change</td><td class="${mcapChange > 0 ? 'positive' : 'negative'}">${mcapChange > 0 ? '+' : ''}${mcapChange.toFixed(2)}%</td></tr>
                            <tr><td>24h Volume</td><td>${formatNumber(volume)}</td></tr>
                            <tr><td>BTC Dominance</td><td>${btcDominance.toFixed(1)}%</td></tr>
                        </table>
                    </div>
                    
                    <div class="card">
                        <h2>🏆 Top 10 Gainers (24h)</h2>
                        <table>
                            <thead><tr><th>#</th><th>Coin</th><th>Price</th><th>Change</th></tr></thead>
                            <tbody>
                                ${moverRows(gainers)}
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="card">
                        <h2>💔 Top 10 Losers (24h)</h2>
                        <table>
                            <thead><tr><th>#</th><th>Coin</th><th>Price</th><th>Change</th></tr></thead>
                            <tbody>
                                ${moverRows(losers)}
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <div class="card" style="grid-column: 1 / -1;">
                    <h2>📊 Top 100 Cryptocurrencies</h2>
                    <div style="overflow-x: auto;">
                        <table>
                            <thead>
                                <tr><th>#</th><th>Coin</th><th>Price</th><th>Market Cap</th><th>24h Volume</th><th>24h Change</th></tr>
                            </thead>
                            <tbody>
                                ${coins.map((c, i) => `
                                    <tr>
                                        <td>${i+1}</td>
                                        <td>${coinImage(c.image)}${escapeHtml(c.symbol.toUpperCase())}</td>
                                        <td>$${c.current_price?.toLocaleString() || 'N/A'}</td>
                                        <td>${formatNumber(c.market_cap || 0)}</td>
                                        <td>${formatNumber(c.total_volume || 0)}</td>
                                        <td class="${(c.price_change_percentage_24h || 0) > 0 ? 'positive' : 'negative'}">${changeText(c.price_change_percentage_24h)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            
            document.getElementById('content').innerHTML = html;
        }

        // Countdown timer
        function updateCountdown() {
            document.getElementById('countdown').textContent = isFetching
                ? 'Refreshing...'
                : `Auto-refresh in: ${countdown}s`;
        }

        function startCountdown() {
            setInterval(() => {
                if (isFetching) return;
                countdown = Math.max(countdown - 1, 0);
                updateCountdown();
                if (countdown === 0) {
                    fetchData();
                }
            }, 1000);
        }

        // Initial load
        fetchData();
        startCountdown();
    </script>
</body>
</html>
